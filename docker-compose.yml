services:
  postgresql:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - hotel-net

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      - postgresql
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"
    networks:
      - hotel-net

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - hotel-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - hotel-net

  api:
    build: .
    command: ["node", "dist/index.js"]
    depends_on:
      - temporal
      - redis
    environment:
      PORT: 3000
      SELF_BASE_URL: http://api:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offer-task-queue
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - hotel-net

  worker:
    build: .
    command: ["node", "dist/temporal/worker.js"]
    depends_on:
      - temporal
      - redis
      - api
    environment:
      SELF_BASE_URL: http://api:3000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offer-task-queue
    restart: on-failure
    networks:
      - hotel-net

volumes:
  temporal-postgres-data:

networks:
  hotel-net:
    driver: bridge
